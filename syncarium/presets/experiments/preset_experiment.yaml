# NAMESPACES
namespaces:
  TimeStick_ns:
    IP/mask:        "10.102.0.10/24"
    gateway:        "10.102.0.1"
    interface:      "PTP_TimeStick"

# PTP PARAMETERS
ptp_clients:
  TimeStick:
    config: TimeStick.conf
    namespace: TimeStick_ns
    interface: PTP_TimeStick

# TGEN STL PARAMETERS
stl_profile: "stl_Ly3_E1.py"
stl_profile_args:
  load_percentage: 50
  traffic_model: "TM1"
  port_list: "[0,1,2,3,4,5,6,7]"

# DEXT PARAMETERS
data_extractor_sources:
  TimeStick_PTP_Log:
    data_class: FileLogDataSource
    pattern: "master offset\\s+(?P<offset>-?\\d+)\\s+s2\\s+freq\\s+(?P<freq>[+-]?\\d+)\\s+path delay\\s+(?P<delay>\\d+)"
    filepath: ptp-TimeStick.log
  PPSAnalyzer:
    data_class: PPSAnalyzerDataSource
    serial_port: "/dev/ttyUSB1"
    pps_inputs: [3,4,5]
    cable_delays: [0,0,0]

# GLOBAL EXPERIMENT PARAMETERS
ptp_start: 10
stl_start: -1
data_extractor_start: 10
ptp_stop_at_end: false
total_duration: 30
output_filepath: "Ly3_PresetExperiment"