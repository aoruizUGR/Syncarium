# ─────────────────────────────────────────────────────────────
# Syncarium MQTT Broker Configuration
# ─────────────────────────────────────────────────────────────

# MQTT listener
listener 1883 0.0.0.0
protocol mqtt

# Initial research deployment.
# Replace with password authentication before exposing the broker
# outside a trusted laboratory network.
allow_anonymous true

# Persistent broker state
persistence true
persistence_location /mosquitto/data/

# Log configuration
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

log_type error
log_type warning
log_type notice
log_type information

# Include connection and disconnection events
connection_messages true

# Timestamp log entries
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Resource limits
max_connections -1
max_queued_messages 10000
message_size_limit 1048576

# Keep retained messages and persistent sessions
autosave_interval 60

# Do not transmit anonymous client information
allow_zero_length_clientid false